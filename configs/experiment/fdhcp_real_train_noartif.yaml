# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: datamodule
  - override /model: segmentor
  - override /callbacks: default
  - override /trainer: gpu

# same as filename without extension
task_name: fdhcp_real_train_noartif

data:
  train_type: synth # "synth", "real"
  val_type: real # "synth", "real"

  generator:
    simulate_motion: null
    boundaries: null
    struct_noise: null
    blur_cortex: null

  split_file: /home/vzalevskyi/Data/fetal_dHCP/derivatives/splits.csv 
  bids_path: /home/vzalevskyi/Data/fetal_dHCP/derivatives/resampled05
  seed_path: /home/vzalevskyi/Data/fetal_dHCP/derivatives/seeds

  train_split: train
  val_split: val # "synth", "real", "test"
  # test type always test
  test_split: test

  num_workers: 2
  batch_size: 1


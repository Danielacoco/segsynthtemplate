# python train.py experiment=example

defaults:
  - override /data: datamodule
  - override /model: segmentor
  - override /callbacks: default
  - override /trainer: gpu

# same as filename without extension
task_name: feta_fss_yaartif

data:
  train_type: synth # "synth", "real"
  val_type: real # "synth", "real"

  # generator:
    # blur_cortex: null
  #   simulate_motion: null
  #   struct_noise: null
  #   boundaries: null

  split_file: /media/vzalevskyi/data/FETA_challenge/quality_test/derivatives/quality_test.csv 
  bids_path: /media/vzalevskyi/data/FETA_challenge/merged_feta_spinabifida/derivatives/resampled05
  seed_path: /media/vzalevskyi/data/FETA_challenge/merged_feta_spinabifida/derivatives/seeds

  train_split: train
  val_split: validation # "synth", "real", "test"
  # test type always test
  test_split: test

  

  num_workers: 1
  batch_size: 1

model:
  net:
    out_channels: 8
  num_classes: 8
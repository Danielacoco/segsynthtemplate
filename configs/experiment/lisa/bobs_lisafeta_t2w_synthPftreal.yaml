# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: datamodule
  - override /model: segmentor
  - override /callbacks: default
  - override /trainer: gpu

# same as filename without extension
task_name: bobs_lisafeta_t2w_synthPftreal

model:
  net:
    out_channels: 16
  num_classes: 16



data:
  train_type: real # "synth", "real"
  val_type: real # "synth", "real"

  img_suffix: T2w
  seg_suffix: desc-fetalisa_dseg
  apply_mri_augm: true


  generator:
    resolution: [1.0, 1.0, 1.0]
    shape: [256, 256, 256]
    spatial_deform:
      flip_prb: 0

    intensity_generator:
      min_subclusters: 3
      max_subclusters: 9

    resampler:
      prob: 0.9
      min_resolution: 3
      max_resolution: 5.5

    simulate_motion: null
    boundaries: null
    struct_noise: null
    blur_cortex: null

  split_file: /home/vzalevskyi/Desktop/Data/neonatal_bobsV1.0/derivatives/splits/trainall.csv
  bids_path: /home/vzalevskyi/Desktop/Data/neonatal_bobsV1.0/derivatives/resampled1

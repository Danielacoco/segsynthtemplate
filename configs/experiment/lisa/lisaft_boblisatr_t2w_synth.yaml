# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: datamodule
  - override /model: segmentor
  - override /callbacks: default
  - override /trainer: gpu

# same as filename without extension
task_name: bobs_lisa_t2w_synth

model:
  net:
    out_channels: 9
  num_classes: 9



data:
  train_type: synth # "synth", "real"
  val_type: real # "synth", "real"

  img_suffix: T2w
  seg_suffix: desc-lisa_dseg


  generator:
    resolution: [1.0, 1.0, 1.0]
    shape: [256, 256, 256]
    spatial_deform:
      flip_prb: 0

    intensity_generator:
      min_subclusters: 3
      max_subclusters: 9

    resampler:
      prob: 0.9
      min_resolution: 3
      max_resolution: 5.5

    simulate_motion: null
    boundaries: null
    struct_noise: null
    blur_cortex: null

  split_file: /media/vzalevskyi/data/neonatal_bobsV1.0/derivatives/splits/trainall.csv
  bids_path: /media/vzalevskyi/data/neonatal_bobsV1.0/derivatives/resampled1
  seed_path: /media/vzalevskyi/data/neonatal_bobsV1.0/derivatives/seedsT2w

  train_split: train
  val_split: val # "synth", "real", "test"
  # test type always test
  test_split: test

  num_workers: 1
  batch_size: 1

trainer:
  log_every_n_steps: null

logger:
  wandb:
    project: lisa


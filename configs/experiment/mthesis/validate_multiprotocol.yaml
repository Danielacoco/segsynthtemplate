# @package _global_
# Experiment config for validating MultiProtocolDataModule.
# Run with:
#   python segsynthtemplate/validatedate_multiprotocol.py experiment=mthesis/validate_multiprotocol

defaults:
  - override /data: multiprotocol_datamodule

task_name: validate_multiprotocol

data:
  train_type: real
  val_type: real
  transforms: null #for null monai transforms

  # null out all augmentations for real mode — spatial deformation still applies
  generator:
    simulate_motion: null
    boundaries: null
    struct_noise: null
    blur_cortex: null
  train_split: train
  val_split: val
  test_split: test_i

  # List of datasets. Add more entries to mix protocols or cohorts.
  # protocol_name must match the values in the 'protocol' column of label_map_multiprotocol.csv.
  datasets:
    - bids_path:      /media/danielaco/HDD2TB/DataDaniela/feta_2.4/derivatives/resampled05/resampled05/
      split_file:     /media/danielaco/HDD2TB/DataDaniela/feta_2.4/splits.csv
      protocol_name:  feta

    - bids_path:      /media/danielaco/HDD2TB/DataDaniela/fetalDHCP/resampled05/
      split_file:     /media/danielaco/HDD2TB/DataDaniela/fetalDHCP/resampled05/splits.csv
      protocol_name:  drawem9_albert
      img_suffix:     T2w
      seg_suffix:     desc-drawem9_dseg

  label_map_csv: /home/danielaco/Documents/segsynthtemplate/label_map_multiprotocol.csv

  num_workers: 1
  batch_size: 1

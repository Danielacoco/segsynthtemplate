# @package _global_
# Neonatal BOBS specialist — plain UNet, no FiLM conditioning.
# In-domain baseline for the neonatal BOBS cohort (bobs9 label space).
#
# Run with:
#   python segsynthtemplate/train.py experiment=mthesis/bobs_specialist_real

defaults:
  - override /data: multiprotocol_datamodule
  - override /model: plain_unet_segmentor
  - override /callbacks: default
  - override /trainer: default

task_name: bobs_specialist

callbacks:
  model_checkpoint:
    filename: "epoch_{epoch:03d}_val_dice_{val/dice:.4f}_step_{step}"
    monitor: "val/dice"
    mode: "max"

trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 1000
  precision: 16-mixed
  check_val_every_n_epoch: 5

model:
  protocol_names:
    - bobs9
  net:
    num_protocols: 1
    conditioned: false

data:
  train_type: real
  val_type: real

  generator:
    device: cuda:0
    simulate_motion: null
    boundaries: null
    struct_noise: null
    blur_cortex: null

  train_split: train
  val_split: val
  test_split: test_i

  datasets:
    - bids_path:      /media/danielaco/HDD2TB/DataDaniela/neonatal_bobsV1.0/resampled75/
      split_file:     /media/danielaco/HDD2TB/DataDaniela/neonatal_bobsV1.0/resampled75/splits_40_10_15_35.csv
      protocol_name:  bobs9
      img_suffix:     space-INFANTMNIacpc_T2w
      seg_suffix:     space-INFANTMNIacpc_desc-bobs9_dseg

  label_map_csv: /home/danielaco/Documents/segsynthtemplate/label_map_multiprotocol.csv
  num_workers: 2
  batch_size: 2

logger:
  wandb:
    project: mthesis

seed: 42

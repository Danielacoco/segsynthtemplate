# @package _global_
# dHCP-only specialist — CoNeMOS backbone, no FiLM conditioning.
# Architecturally identical to joint_nocond_real but trained on dHCP only.
# Controlled baseline: isolates the cost of joint training from conditioning.
#
# Run with:
#   python segsynthtemplate/train.py experiment=mthesis/dhcp_specialist_conemos

defaults:
  - override /data: multiprotocol_datamodule
  - override /model: plain_unet_segmentor
  - override /callbacks: default
  - override /trainer: default

model:
  protocol_names:
    - drawem9_albert
  net:
    num_protocols: 1
    conditioned: false

task_name: dhcp_specialist_conemos

callbacks:
  model_checkpoint:
    filename: "epoch_{epoch:03d}_val_dice_{val/dice:.4f}_step_{step}"
    monitor: "val/dice"
    mode: "max"

trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 1000
  precision: 16-mixed
  check_val_every_n_epoch: 5

data:
  train_type: real
  val_type: real
  # transforms: null

  generator:
    device: cuda:0
    simulate_motion: null
    boundaries: null
    struct_noise: null
    blur_cortex: null

  train_split: train
  val_split: val
  test_split: test_i

  datasets:
    - bids_path:      /media/danielaco/HDD2TB/DataDaniela/fetalDHCP/resampled75/
      split_file:     /media/danielaco/HDD2TB/DataDaniela/fetalDHCP/resampled75/splits_40_10_15_35.csv
      protocol_name:  drawem9_albert
      img_suffix:     T2w
      seg_suffix:     desc-drawem9_dseg

  label_map_csv: /home/danielaco/Documents/segsynthtemplate/label_map_multiprotocol.csv
  num_workers: 2
  batch_size: 2

logger:
  wandb:
    project: mthesis

seed: 42

defaults:
  # important configs defining data and model
  - data: datamodule
  - model: segmentor
  # configs defining logging and callbacks
  - callbacks: default
  - logger: wandb
  - trainer: gpu
  - paths: default
  - extras: default
  - hydra: default
  - _self_


model:
  net:
    out_channels: 16
  num_classes: 16

data:
  split_file: /media/vzalevskyi/data/LISA2025/bids/derivatives/splits/testall.csv
  bids_path: /media/vzalevskyi/data/LISA2025/bids/derivatives/task2_LFsegm
  seed_path: null

  num_workers: 12
  batch_size: 1
  img_suffix: T2w
  seg_suffix: dseg
  load_segmentations: true

  transforms:
    _target_: monai.transforms.Compose
    transforms:
      - _target_: monai.transforms.Orientationd
        keys: ["image", "label"]
        axcodes: "RAS"

      - _target_: monai.transforms.SignalFillEmptyd
        keys: ["image", "label"]
        replacement: 0
        allow_missing_keys: true

      - _target_: monai.transforms.Spacingd
        keys: ["image", "label"]
        pixdim: [1, 1, 1]
        mode: ["bilinear", "nearest"]
        allow_missing_keys: true

      - _target_: monai.transforms.SpatialPadd
        keys: ["image", "label"]
        spatial_size: [256, 256, 256]
        mode: "constant"
        allow_missing_keys: true

      - _target_: monai.transforms.CenterSpatialCropd
        keys: ["image", "label"]
        roi_size: [256, 256, 256]
        allow_missing_keys: true

      - _target_: monai.transforms.ScaleIntensityd
        keys: ["image"]
        minv: 0
        maxv: 1


save_path: /media/vzalevskyi/data/LISA2025/bids/derivatives/predictions

test_splits:
  - test


metrics:
  - dice
  - hd95th
  - vs

device: cuda:0

ckpt_paths:
  - /mnt/Home2/projects/segsynthtemplate/None/logs/bobs_lisafeta_t2w_synth/runs/2025-06-17_11-34-54/checkpoints/epoch_903_val_dsc_0.6672_step_59664.ckpt

hydra:
  run:
    dir: .
  output_subdir: null

task_name: "eval"

tags: ["dev"]

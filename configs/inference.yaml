# passing checkpoint paths is necessary for evaluation
ckpt_paths:
  - /mnt/Home2/projects/segsynthtemplate/None/logs/fetaall_synth_ftreal_interp05/runs/2025-05-20_18-44-49/checkpoints/interp.ckpt
  # - /mnt/Home2/projects/segsynthtemplate/None/logs/fetaall_synth/runs/2025-05-09_18-19-58/checkpoints/epoch_949_val_dsc_0.8292_step_99750.ckpt
  # - /mnt/Home2/projects/segsynthtemplate/None/logs/feta_fss_noartif/runs/2025-05-26_10-16-14/checkpoints/epoch_805_val_dsc_0.8305_step_41106.ckpt
  # - /mnt/Home2/projects/segsynthtemplate/None/logs/feta_fss_yaartif/runs/2025-05-24_16-18-05/checkpoints/epoch_809_val_dsc_0.8242_step_41310.ckpt


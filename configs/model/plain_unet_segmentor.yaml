_target_: segsynthtemplate.models.conemos_segmentor.CoNeMOSSegmentor

# Same backbone as CoNeMOS but with FiLM and MLP disabled.
# protocol_vec from the batch is still used to look up the annotation mask
# for masked CE — the network itself receives no conditioning signal.
num_fg_channels: 8

protocol_names:
  - feta
  - drawem9_albert
  - bobs9

label_map_csv: /home/danielaco/Documents/segsynthtemplate/label_map_multiprotocol.csv

net:
  _target_: segsynthtemplate.models.conemos_unet.CoNeMOSUNet
  num_protocols: 3
  num_fg_channels: ${model.num_fg_channels}
  n_levels: 4
  n_features_init: 16
  feat_mult: 2
  n_conv_per_level: 2
  conv_size: 3
  norm_type: null
  n_conditioned_layers: 0
  mlp_hidden_dim: 64
  mlp_n_layers: 4
  conditioned: false

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  weight_decay: 0.0

scheduler: null

compile: false
lr: 0.0001
